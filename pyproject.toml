[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oversight-arena"
version = "0.1.0"
description = "OpenEnv environment for training scalable-oversight overseer LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "anikasoni"}]
dependencies = [
    "openenv-core>=0.2.1",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "requests>=2.31",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "transformers>=4.41",
    "trl>=0.11",
    "datasets>=2.16",
    "accelerate>=0.27",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "matplotlib>=3.7",
    "pandas>=2.0",
]
plot = ["matplotlib>=3.7", "pandas>=2.0"]
test = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oversight_arena*"]

[tool.setuptools.package-data]
"oversight_arena" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
