name: oversight-arena
version: 0.1.0
description: >
  Multi-agent AI safety benchmark. An overseer reviews code patches from
  3 worker agents per episode; one or more submit subtle CWE-class bugs
  (null-deref, mutable default arg, off-by-one). The overseer flags them.
  Verifiable F1 reward with anti-hacking guardrails. Parametric difficulty
  for RLVE curriculum training.

# --- OpenEnv server config ---
env_class: oversight_arena.server.oversight_environment.OversightArenaEnvironment
app: oversight_arena.server.app:app

# --- Package info ---
package: oversight-arena
install: pip install git+https://huggingface.co/spaces/anikasoni/oversight-arena

# --- Interface type ---
interface: typed           # typed | mcp

# --- Action / Observation types ---
action_type: oversight_arena.models.OverseerAction
observation_type: oversight_arena.models.OversightObservation
state_type: oversight_arena.models.OversightState

# --- Metadata ---
tags:
  - ai-safety
  - scalable-oversight
  - multi-agent
  - code-review
  - rlvr
  - rlve
  - curriculum

author: anikasoni
license: MIT
homepage: https://github.com/anikasoni/oversight-arena